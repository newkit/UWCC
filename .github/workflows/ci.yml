name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            spike/m0/package-lock.json
      - name: Rust toolchain
        run: rustup show
      - name: Core - format, lint, test
        working-directory: core
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Web app - build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: M0 spike - build
        working-directory: spike/m0
        run: |
          npm ci
          npm run build
      - name: Assemble site
        run: |
          mkdir -p _site/spike/m0
          cp -r web/dist/. _site/
          cp -r spike/m0/dist/. _site/spike/m0/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
