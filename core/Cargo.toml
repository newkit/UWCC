[package]
name = "uwcc-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "UWCC core: underwater colour-correction analysis and reference implementation"
repository = "https://github.com/newkit/UWCC"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[profile.release]
opt-level = 3
lto = true
